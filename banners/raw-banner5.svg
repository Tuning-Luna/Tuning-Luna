<svg
  fill="none"
  viewBox="0 0 900 555"
  width="100%"
  height="555"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="banner-title"
>
  <title id="banner-title">Animated banner with floating particles</title>

  <defs>

    <!-- =========================================================
         圆角裁剪
         ========================================================= -->
    <clipPath id="bannerClip">
      <rect width="900" height="555" rx="18" />
    </clipPath>

    <!-- =========================================================
         整体暗色渐变
         ========================================================= -->
    <linearGradient
      id="backgroundOverlay"
      x1="0" y1="0" x2="1" y2="0"
    >
      <stop offset="0%"   stop-color="#05070A" stop-opacity="0.78" />
      <stop offset="35%"  stop-color="#080B10" stop-opacity="0.48" />
      <stop offset="70%"  stop-color="#080B10" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#05070A" stop-opacity="0.55" />
    </linearGradient>

    <!-- =========================================================
         底部暗色
         ========================================================= -->
    <linearGradient
      id="bottomFade"
      x1="0" y1="0" x2="0" y2="1"
    >
      <stop offset="0%"   stop-color="#05070A" stop-opacity="0" />
      <stop offset="72%"  stop-color="#05070A" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#05070A" stop-opacity="0.58" />
    </linearGradient>

    <!-- =========================================================
         左侧文字保护区域
         ========================================================= -->
    <linearGradient
      id="textAreaFade"
      x1="0" y1="0" x2="1" y2="0"
    >
      <stop offset="0%"   stop-color="#05070A" stop-opacity="0.48" />
      <stop offset="55%"  stop-color="#05070A" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#05070A" stop-opacity="0" />
    </linearGradient>

    <!-- =========================================================
         蓝紫环境光
         ========================================================= -->
    <radialGradient
      id="ambientGlow"
      cx="0" cy="0" r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(750 110) rotate(120) scale(330)"
    >
      <stop offset="0%"   stop-color="#38BDF8" stop-opacity="0.14" />
      <stop offset="45%"  stop-color="#818CF8" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </radialGradient>

    <!-- =========================================================
         文字阴影
         ========================================================= -->
    <filter
      id="textShadow"
      x="-20%" y="-30%" width="140%" height="160%"
    >
      <feDropShadow
        dx="0" dy="3" stdDeviation="7"
        flood-color="#000000" flood-opacity="0.70"
      />
    </filter>

  </defs>


  <!-- =========================================================
       CSS / Animation
       ========================================================= -->
  <style>

    /* ---------------------------------------------------------
       背景缩放循环动画
       0% → 1.0 倍
       50% → 1.08 倍
       100% → 1.0 倍
       无限循环，不使用 alternate，因为关键帧已包含往返
       --------------------------------------------------------- */
    .scenery-img {
      transform-box: fill-box;
      transform-origin: center;
      animation: kenBurns 24s ease-in-out infinite;
    }

    @keyframes kenBurns {
      0% {
        transform: scale(1.0) translate(0, 0);
      }
      50% {
        transform: scale(1.08) translate(-0.6%, -0.5%);
      }
      100% {
        transform: scale(1.0) translate(0, 0);
      }
    }


    /* ---------------------------------------------------------
       环境光呼吸
       --------------------------------------------------------- */
    .ambient-light {
      transform-box: fill-box;
      transform-origin: center;
      animation: ambientPulse 9s ease-in-out infinite alternate;
    }

    @keyframes ambientPulse {
      0%   { opacity: 0.65; transform: scale(0.97); }
      100% { opacity: 1;    transform: scale(1.04); }
    }


    /* ---------------------------------------------------------
       漂浮光点粒子
       --------------------------------------------------------- */
    .particle {
      animation: particleFloat var(--dur, 14s) ease-in-out infinite;
      animation-delay: var(--delay, 0s);
      will-change: transform, opacity;
    }

    @keyframes particleFloat {
      0% {
        transform: translate(0, 0) scale(1);
        opacity: 0.08;
      }
      25% {
        opacity: 0.50;
      }
      50% {
        transform: translate(var(--dx, 2px), var(--dy, -4px)) scale(1.15);
        opacity: 0.25;
      }
      75% {
        opacity: 0.55;
      }
      100% {
        transform: translate(0, 0) scale(1);
        opacity: 0.08;
      }
    }


    /* ---------------------------------------------------------
       标题 / 副标题 / 标签
       --------------------------------------------------------- */
    .title {
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 2.5px;
      fill: #F5F7FA;
    }

    .subtitle {
      font-family:
        ui-monospace, SFMono-Regular, Menlo, Monaco,
        Consolas, "Liberation Mono", monospace;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 1.4px;
      fill: #A8B1BD;
    }

    .eyebrow {
      font-family:
        ui-monospace, SFMono-Regular, Menlo, Monaco,
        Consolas, "Liberation Mono", monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 2px;
      fill: #9FB5CE;
    }


    /* ---------------------------------------------------------
       无障碍：精确针对动画元素禁用动画
       --------------------------------------------------------- */
    @media (prefers-reduced-motion: reduce) {
      .scenery-img,
      .ambient-light,
      .particle {
        animation: none;
      }
    }

  </style>


  <!-- =========================================================
       内容区域
       ========================================================= -->
  <g clip-path="url(#bannerClip)">

    <!-- 背景图片 -->
    <image
      class="scenery-img"
      x="0" y="0"
      width="900" height="555"
      preserveAspectRatio="xMidYMid slice"
      href="data:image/jpeg;base64,YOUR_IMAGE_BASE64_HERE"
    />

    <!-- 整体暗色层 -->
    <rect width="900" height="555" fill="url(#backgroundOverlay)" />

    <!-- 环境光 -->
    <rect class="ambient-light" width="900" height="555" fill="url(#ambientGlow)" />

    <!-- 左侧文字保护 -->
    <rect width="560" height="555" fill="url(#textAreaFade)" />

    <!-- 底部暗色 -->
    <rect width="900" height="555" fill="url(#bottomFade)" />


    <!-- =======================================================
         漂浮光点粒子层
         ======================================================= -->

    <g>
      <!-- 淡蓝色粒子 -->
      <circle class="particle" cx="60"  cy="80"  r="1.6" fill="#A0C4FF" style="--dur:13s; --delay:-1.2s; --dx:3px; --dy:-5px;" />
      <circle class="particle" cx="180" cy="45"  r="1.2" fill="#A0C4FF" style="--dur:17s; --delay:-4.5s; --dx:-2px; --dy:-3px;" />
      <circle class="particle" cx="310" cy="120" r="2.0" fill="#A0C4FF" style="--dur:11s; --delay:-7.1s; --dx:4px; --dy:-6px;" />
      <circle class="particle" cx="450" cy="60"  r="1.4" fill="#A0C4FF" style="--dur:15s; --delay:-2.8s; --dx:-3px; --dy:-4px;" />
      <circle class="particle" cx="590" cy="150" r="1.8" fill="#A0C4FF" style="--dur:19s; --delay:-9.3s; --dx:2px; --dy:-7px;" />
      <circle class="particle" cx="730" cy="90"  r="1.1" fill="#A0C4FF" style="--dur:12s; --delay:-5.6s; --dx:-4px; --dy:-3px;" />
      <circle class="particle" cx="850" cy="200" r="1.5" fill="#A0C4FF" style="--dur:16s; --delay:-1.9s; --dx:3px; --dy:-5px;" />

      <!-- 淡白色粒子 -->
      <circle class="particle" cx="120" cy="220" r="1.3" fill="#FFFFFF" style="--dur:14s; --delay:-3.4s; --dx:-2px; --dy:-6px;" />
      <circle class="particle" cx="260" cy="310" r="1.7" fill="#FFFFFF" style="--dur:18s; --delay:-8.2s; --dx:5px; --dy:-4px;" />
      <circle class="particle" cx="400" cy="180" r="1.0" fill="#FFFFFF" style="--dur:10s; --delay:-0.7s; --dx:-3px; --dy:-5px;" />
      <circle class="particle" cx="540" cy="280" r="2.2" fill="#FFFFFF" style="--dur:20s; --delay:-6.5s; --dx:2px; --dy:-8px;" />
      <circle class="particle" cx="680" cy="340" r="1.4" fill="#FFFFFF" style="--dur:13s; --delay:-2.1s; --dx:-4px; --dy:-4px;" />
      <circle class="particle" cx="820" cy="120" r="1.6" fill="#FFFFFF" style="--dur:15s; --delay:-10.4s; --dx:3px; --dy:-6px;" />

      <!-- 淡紫色粒子 -->
      <circle class="particle" cx="90"  cy="400" r="1.5" fill="#C4B5FD" style="--dur:16s; --delay:-4.8s; --dx:-3px; --dy:-5px;" />
      <circle class="particle" cx="220" cy="480" r="1.1" fill="#C4B5FD" style="--dur:12s; --delay:-1.5s; --dx:2px; --dy:-4px;" />
      <circle class="particle" cx="360" cy="520" r="1.9" fill="#C4B5FD" style="--dur:19s; --delay:-7.7s; --dx:-4px; --dy:-7px;" />
      <circle class="particle" cx="500" cy="440" r="1.3" fill="#C4B5FD" style="--dur:14s; --delay:-3.2s; --dx:3px; --dy:-5px;" />
      <circle class="particle" cx="640" cy="500" r="1.7" fill="#C4B5FD" style="--dur:17s; --delay:-9.1s; --dx:-2px; --dy:-6px;" />
      <circle class="particle" cx="780" cy="420" r="1.0" fill="#C4B5FD" style="--dur:11s; --delay:-5.3s; --dx:4px; --dy:-3px;" />

      <!-- 补充粒子，覆盖中部区域 -->
      <circle class="particle" cx="150" cy="150" r="1.4" fill="#A0C4FF" style="--dur:15s; --delay:-2.5s; --dx:3px; --dy:-4px;" />
      <circle class="particle" cx="290" cy="230" r="1.0" fill="#FFFFFF" style="--dur:12s; --delay:-6.8s; --dx:-2px; --dy:-6px;" />
      <circle class="particle" cx="430" cy="350" r="1.8" fill="#C4B5FD" style="--dur:18s; --delay:-1.1s; --dx:4px; --dy:-5px;" />
      <circle class="particle" cx="570" cy="400" r="1.2" fill="#A0C4FF" style="--dur:13s; --delay:-8.9s; --dx:-3px; --dy:-7px;" />
      <circle class="particle" cx="710" cy="250" r="1.6" fill="#FFFFFF" style="--dur:16s; --delay:-3.7s; --dx:2px; --dy:-4px;" />
      <circle class="particle" cx="840" cy="320" r="1.3" fill="#C4B5FD" style="--dur:14s; --delay:-7.4s; --dx:-4px; --dy:-5px;" />

      <!-- 少量靠近文字区域上方的粒子 -->
      <circle class="particle" cx="100" cy="540" r="1.1" fill="#A0C4FF" style="--dur:19s; --delay:-11.2s; --dx:3px; --dy:-6px;" />
      <circle class="particle" cx="200" cy="520" r="1.4" fill="#FFFFFF" style="--dur:15s; --delay:-4.1s; --dx:-2px; --dy:-5px;" />
      <circle class="particle" cx="320" cy="545" r="1.0" fill="#C4B5FD" style="--dur:12s; --delay:-9.6s; --dx:4px; --dy:-4px;" />
      <circle class="particle" cx="460" cy="530" r="1.7" fill="#A0C4FF" style="--dur:17s; --delay:-2.9s; --dx:-3px; --dy:-7px;" />

      <!-- 右上角区域 -->
      <circle class="particle" cx="750" cy="30"  r="1.5" fill="#FFFFFF" style="--dur:13s; --delay:-5.9s; --dx:3px; --dy:-5px;" />
      <circle class="particle" cx="870" cy="70"  r="1.2" fill="#C4B5FD" style="--dur:16s; --delay:-1.3s; --dx:-2px; --dy:-6px;" />

      <!-- 左下角区域 -->
      <circle class="particle" cx="30"  cy="490" r="1.3" fill="#A0C4FF" style="--dur:14s; --delay:-8.5s; --dx:2px; --dy:-4px;" />
      <circle class="particle" cx="400" cy="550" r="1.1" fill="#FFFFFF" style="--dur:11s; --delay:-3.9s; --dx:-3px; --dy:-5px;" />
    </g>


    <!-- =======================================================
         文字区域
         ======================================================= -->

    <g transform="translate(48 390)" filter="url(#textShadow)">

      <!-- 小标签 -->
      <g transform="translate(0 -50)">
        <circle cx="5" cy="5" r="4" fill="#58A6FF" />
        <text x="17" y="10" class="eyebrow">
          DEVELOPER · BUILDER · EXPLORER
        </text>
      </g>

      <!-- 主标题 -->
      <text x="0" y="0" class="title">
        HELLO &amp; WELCOME
      </text>

      <!-- 副标题 -->
      <text x="2" y="34" class="subtitle">
        Keep exploring, building, and learning.
      </text>

    </g>


    <!-- =======================================================
         右上角装饰圆
         ======================================================= -->

    <circle cx="790" cy="95" r="150" fill="none"
            stroke="#58A6FF" stroke-opacity="0.035" stroke-width="1" />

    <circle cx="790" cy="95" r="105" fill="none"
            stroke="#818CF8" stroke-opacity="0.04" stroke-width="1" />

  </g>


  <!-- =========================================================
       极简边框：双线结构，无彩色
       ========================================================= -->

  <rect
    x="0.75" y="0.75" width="898.5" height="553.5" rx="18"
    fill="none"
    stroke="#FFFFFF"
    stroke-opacity="0.08"
    stroke-width="1.25"
  />

  <rect
    x="6" y="6" width="888" height="543" rx="14"
    fill="none"
    stroke="#FFFFFF"
    stroke-opacity="0.04"
    stroke-width="0.75"
  />

</svg>